<script>
const $=id=>document.getElementById(id), data=JSON.parse($('evidence').textContent);
const online=location.protocol.startsWith('http') && ['localhost','127.0.0.1'].includes(location.hostname);
let policy='',candidate='',strategy='',lastGroup='',number=1,accepted=false,decisionSeen=false,mode='',cancel=0,playing=false;
function output(label,text){$('outLabel').textContent=label;$('output').textContent=text;$('output').scrollTop=$('output').scrollHeight}
function description(r){return r?[r.action,r.debt,r.payments?r.payments+' × '+r.installment:''].filter(Boolean).join(' · '):'Sin salida válida'}
function handle(e){
 switch(e.event){
 case 'mode':mode=e.text;$('mode').textContent=mode;break;
 case 'start':delete document.querySelector('.art').dataset.choice;policy=e.policy;strategy=e.strategy;candidate='';decisionSeen=false;accepted=false;lastGroup='';$('cases').replaceChildren();$('summary').textContent='';$('meter').textContent='';$('tokens').textContent='';$('scene').className='idle';$('step').textContent='POLÍTICA INICIAL';$('title').textContent='Política de partida';$('left').textContent='H'+(number-1)+' · Vigente';$('right').textContent='H'+number+' · Candidata';output('Política vigente',policy);break;
 case 'phase':if(e.stage==='update'&&decisionSeen){$('left').textContent='H'+(accepted?number:number-1)+' · Vigente';$('right').textContent='φ · Revisión'}$('step').textContent=({load:'CARGA DEL MODELO',propose:'GENERACIÓN',evaluate:'EVALUACIÓN',update:'ACTUALIZACIÓN'})[e.stage];$('core').textContent='Qwen';$('title').textContent=e.title;$('scene').className=e.stage==='propose'?'working':candidate?'hasCandidate':'';$('tokens').textContent='';output(e.stage==='propose'?'Propuesta de política':e.stage==='update'?'Instrucciones de mejora':'Salida del negociador',e.stage==='load'?'Preparando pesos locales…':'Esperando la respuesta…');break;
 case 'stream':if(!e.text&&e.tokens)output($('outLabel').textContent,'Generando respuesta…');$('tokens').textContent=e.tokens==null?'':e.tokens+' tokens';if(e.text)output($('outLabel').textContent,e.text);break;
 case 'candidate':candidate=e.policy;$('scene').className='hasCandidate';output('Política candidata',candidate);break;
 case 'case':{const group=e.version+' · '+({development:'desarrollo',validation:'validación'}[e.split]);if(group!==lastGroup){$('cases').replaceChildren();lastGroup=group}
 const d=document.createElement('details'),s=document.createElement('summary'),name=document.createElement('span'),status=document.createElement('b'),p=document.createElement('p');name.textContent=e.message;status.className=e.ok?'yes':'no';status.textContent=e.ok?'Acierto':'Fallo';s.append(name,status);p.textContent='Esperada: '+description(e.expected)+'\nObservada: '+description(e.reply)+(e.violations.length?'\nInfracción: '+e.violations.join(', '):'');d.append(s,p);$('cases').append(d);$('meter').textContent=group+' · '+$('cases').querySelectorAll('.yes').length+'/'+$('cases').children.length+' aciertos';break}
 case 'decision':document.querySelector('.art').dataset.choice=e.accepted?'accepted':'rejected';accepted=e.accepted;decisionSeen=true;$('scene').className=accepted?'accepted hasCandidate':'rejected';$('title').textContent=e.title;$('step').textContent='SELECCIÓN';$('core').textContent='Python';$('summary').textContent=e.title+' · '+e.reason;$('tokens').textContent='';output('Política conservada',accepted?candidate:policy);break;
 case 'strategy':strategy=e.text;output(e.error?'Instrucciones conservadas':'Instrucciones para el siguiente intento',strategy);break;
 case 'error':$('title').textContent='Ejecución interrumpida';output('Error de ejecución',e.title);break;
 case 'done':$('scene').className='idle '+(accepted?'hasCandidate':decisionSeen?'rejected':'');$('start').textContent='Repetir';playing=false;break;
 }}
async function preview(){
 if(playing){cancel++;playing=false;$('start').textContent='Repetir';$('scene').classList.add('idle');return}
 const serial=++cancel;playing=true;$('start').textContent='Detener';number=Number($('attempt').value);
 const r=data[number],prior=data[r.parent];const wait=async ms=>{await new Promise(resolve=>setTimeout(resolve,ms));if(serial!==cancel)throw Error('cancel')};
 handle({event:'start',policy:prior.policy,strategy:r.strategy});await wait(550);
 handle({event:'phase',stage:'propose',title:'Qwen propone H'+number});
 for(let i=0;i<r.policy.length+7;i+=7){handle({event:'stream',text:r.policy.slice(0,i)});await wait(37)}
 handle({event:'candidate',policy:r.policy});await wait(700);
 for(const row of r.rows){handle({event:'phase',stage:'evaluate',title:'Evaluando H'+number});await wait(350);handle({event:'stream',text:JSON.stringify(row.reply,null,2)});handle({event:'case',...row,version:'H'+number,split:'validation'});await wait(750)}
 handle({event:'decision',accepted:r.accepted,title:r.accepted?'Se acepta H'+number:'Se conserva H'+r.parent,reason:'Q pasa de '+prior.score+'/4 a '+r.score+'/4 · Candidata sin infracciones'});await wait(2300);
 handle({event:'phase',stage:'update',title:'Qwen revisa φ'});handle({event:'strategy',text:r.nextStrategy});handle({event:'done'});
}
$('start').onclick=()=>preview().catch(e=>{if(e.message!=='cancel')throw e});
$('attempt').onchange=()=>{cancel++;playing=false;number=Number($('attempt').value);$('start').textContent='Reproducir';handle({event:'start',policy:data[data[number].parent].policy,strategy:data[number].strategy})};
$('attempt').onchange();
if(online){$('controls').hidden=true;$('controls').style.display='none';$('mode').textContent='Conectando';$('note').textContent='Sesión local · Eventos del ejecutor Python';const stream=new EventSource('/events');stream.onmessage=msg=>{const e=JSON.parse(msg.data);handle(e);if(e.event==='done')stream.close()};stream.onerror=()=>{$('mode').textContent='Reconectando al ejecutor'};}
else{$('note').textContent='Vista previa del Test 4 · Datos registrados · Ritmo de escritura ilustrativo.'}
</script></html>
